<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>500 — SamApi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">Sam<span>Api</span></a>
    </div>
  </nav>
  <div class="error-page">
    <div class="code">500</div>
    <h1>Something went wrong.</h1>
    <p>An unexpected server error occurred.</p>
    <p style="color:var(--text-dim);font-size:0.9rem;margin-bottom:1.5rem;">API Status: Operational</p>
    <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
      <a href="javascript:location.reload()" class="btn btn-primary">Retry</a>
      <a href="/docs" class="btn btn-outline">Documentation</a>
    </div>
  </div>
  <script src="/script.js"></script>
</body>
</html>
