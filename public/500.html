<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>500 — Server Error | SamApi</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="error-body">

<div class="bg-decor" aria-hidden="true"></div>

<div class="error-page">
  <div class="error-code error-anim error-500">500</div>
  <h1>Server Error</h1>
  <p>Terjadi kesalahan pada server. Tim kami sedang berusaha memperbaikinya.</p>

  <div class="status-box">
    <span class="dot dot-red" id="statusDot500"></span>
    <span id="statusText500">Memeriksa status API...</span>
  </div>

  <div class="error-actions">
    <button class="btn btn-primary" id="retryBtn">🔄 Retry</button>
    <a href="/" class="btn btn-outline">Kembali ke Homepage</a>
  </div>
</div>

<script src="script.js"></script>
<script>
  document.getElementById('retryBtn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
