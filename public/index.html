const apiDefinitions=[{"slug":"instagram","name":"Instagram Downloader","description":"Download photos, videos, reels, and stories from Instagram links with high quality output.","category":"Downloader","method":"GET","endpoint":"/api/instagram","icon":"Instagram","parameters":[{"name":"url","type":"string","required":true,"description":"The Instagram post, reel, or story URL to download from.","example":"https://www.instagram.com/reel/XXXXXXX/"}],"responseExample":{"success":true,"data":{"platform":"instagram","type":"reel","media":[{"url":"https://cdn.instagram.com/media.mp4","thumbnail":"https://cdn.instagram.com/thumb.jpg","type":"video","quality":"HD"}],"author":{"username":"@username","name":"User Name"},"caption":"Sample caption text"}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.platform","type":"string","description":"Source platform name."},{"name":"data.type","type":"string","description":"Type of media (post, reel, story)."},{"name":"data.media","type":"array","description":"Array of downloadable media objects."},{"name":"data.media[].url","type":"string","description":"Direct download URL."},{"name":"data.media[].thumbnail","type":"string","description":"Thumbnail image URL."},{"name":"data.author","type":"object","description":"Author profile information."}],"exampleRequest":"https://samapi.example.com/api/instagram?url=https://www.instagram.com/reel/XXXXXXX/"},{"slug":"tiktok","name":"TikTok Downloader","description":"Download TikTok videos without watermark in HD, including audio extraction support.","category":"Downloader","method":"GET","endpoint":"/api/tiktok","icon":"Music2","parameters":[{"name":"url","type":"string","required":true,"description":"The TikTok video URL to download.","example":"https://www.tiktok.com/@user/video/XXXXXXX"}],"responseExample":{"success":true,"data":{"platform":"tiktok","title":"Sample TikTok Video","author":{"username":"@creator","nickname":"Creator","avatar":"https://cdn.tiktok.com/avatar.jpg"},"media":[{"url":"https://cdn.tiktok.com/video-no-wm.mp4","type":"video","quality":"HD","noWatermark":true},{"url":"https://cdn.tiktok.com/audio.mp3","type":"audio"}],"statistics":{"plays":1200000,"likes":240000,"comments":5600,"shares":12000}}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.title","type":"string","description":"Video title/caption."},{"name":"data.author","type":"object","description":"Creator profile information."},{"name":"data.media","type":"array","description":"Array of downloadable media (video + audio)."},{"name":"data.statistics","type":"object","description":"Video engagement statistics."}],"exampleRequest":"https://samapi.example.com/api/tiktok?url=https://www.tiktok.com/@user/video/XXXXXXX"},{"slug":"youtube","name":"YouTube Downloader","description":"Download YouTube videos in multiple resolutions, extract audio as MP3, and fetch metadata.","category":"Downloader","method":"GET","endpoint":"/api/youtube","icon":"Youtube","parameters":[{"name":"url","type":"string","required":true,"description":"The YouTube video URL.","example":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"},{"name":"quality","type":"string","required":false,"description":"Preferred video quality (144p, 360p, 720p, 1080p).","example":"1080p"}],"responseExample":{"success":true,"data":{"platform":"youtube","videoId":"dQw4w9WgXcQ","title":"Sample YouTube Video","author":"Channel Name","duration":"3:32","thumbnail":"https://cdn.youtube.com/thumb.jpg","formats":[{"quality":"1080p","url":"https://cdn.youtube.com/1080.mp4","type":"video","size":"45.2 MB"},{"quality":"720p","url":"https://cdn.youtube.com/720.mp4","type":"video","size":"28.1 MB"},{"quality":"mp3","url":"https://cdn.youtube.com/audio.mp3","type":"audio","size":"5.1 MB"}]}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.videoId","type":"string","description":"YouTube video ID."},{"name":"data.title","type":"string","description":"Video title."},{"name":"data.duration","type":"string","description":"Video duration."},{"name":"data.formats","type":"array","description":"Available download formats with direct URLs."}],"exampleRequest":"https://samapi.example.com/api/youtube?url=https://www.youtube.com/watch?v=dQw4w9WgXcQ&quality=1080p"},{"slug":"facebook","name":"Facebook Downloader","description":"Download Facebook videos in HD or SD quality from public posts and reels.","category":"Downloader","method":"GET","endpoint":"/api/facebook","icon":"Facebook","parameters":[{"name":"url","type":"string","required":true,"description":"The Facebook video URL.","example":"https://www.facebook.com/watch?v=XXXXXXX"}],"responseExample":{"success":true,"data":{"platform":"facebook","title":"Sample Facebook Video","author":"Page Name","thumbnail":"https://cdn.facebook.com/thumb.jpg","media":[{"quality":"HD","url":"https://cdn.facebook.com/hd.mp4","type":"video"},{"quality":"SD","url":"https://cdn.facebook.com/sd.mp4","type":"video"}]}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.title","type":"string","description":"Video title."},{"name":"data.author","type":"string","description":"Uploader page name."},{"name":"data.media","type":"array","description":"Available video qualities with download URLs."}],"exampleRequest":"https://samapi.example.com/api/facebook?url=https://www.facebook.com/watch?v=XXXXXXX"},{"slug":"spotify","name":"Spotify Downloader","description":"Download tracks and fetch metadata from Spotify links including album art and artist info.","category":"Downloader","method":"GET","endpoint":"/api/spotify","icon":"Music","parameters":[{"name":"url","type":"string","required":true,"description":"The Spotify track, album, or playlist URL.","example":"https://open.spotify.com/track/XXXXXXX"}],"responseExample":{"success":true,"data":{"platform":"spotify","type":"track","title":"Sample Track","artists":["Artist Name"],"album":"Album Name","releaseDate":"2024-01-15","duration":"3:45","cover":"https://cdn.spotify.com/cover.jpg","preview":"https://cdn.spotify.com/preview.mp3","download":"https://cdn.spotify.com/track.mp3"}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.type","type":"string","description":"Content type (track, album, playlist)."},{"name":"data.title","type":"string","description":"Track or album title."},{"name":"data.artists","type":"array","description":"List of artist names."},{"name":"data.cover","type":"string","description":"Album cover image URL."},{"name":"data.download","type":"string","description":"Direct download URL for the track."}],"exampleRequest":"https://samapi.example.com/api/spotify?url=https://open.spotify.com/track/XXXXXXX"},{"slug":"twitter","name":"Twitter/X Downloader","description":"Download videos and GIFs from Twitter/X posts in original quality.","category":"Downloader","method":"GET","endpoint":"/api/twitter","icon":"Twitter","parameters":[{"name":"url","type":"string","required":true,"description":"The Twitter/X post URL containing media.","example":"https://twitter.com/user/status/XXXXXXX"}],"responseExample":{"success":true,"data":{"platform":"twitter","author":"@username","text":"Sample tweet text","media":[{"type":"video","url":"https://cdn.twitter.com/video.mp4","quality":"original"},{"type":"image","url":"https://cdn.twitter.com/image.jpg"}]}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.author","type":"string","description":"Tweet author handle."},{"name":"data.text","type":"string","description":"Tweet text content."},{"name":"data.media","type":"array","description":"Media attachments with download URLs."}],"exampleRequest":"https://samapi.example.com/api/twitter?url=https://twitter.com/user/status/XXXXXXX"},{"slug":"ai-chat","name":"AI Chat","description":"Send prompts to an AI model and receive intelligent text responses with context awareness.","category":"AI","method":"POST","endpoint":"/api/ai-chat","icon":"Bot","parameters":[{"name":"message","type":"string","required":true,"description":"The prompt or question to send to the AI.","example":"What is the capital of Indonesia?"},{"name":"model","type":"string","required":false,"description":"AI model to use (gpt-4, llama, gemini).","example":"gpt-4"}],"responseExample":{"success":true,"data":{"model":"gpt-4","response":"The capital of Indonesia is Jakarta.","usage":{"prompt_tokens":12,"completion_tokens":8,"total_tokens":20}}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.model","type":"string","description":"AI model used for the response."},{"name":"data.response","type":"string","description":"AI-generated text response."},{"name":"data.usage","type":"object","description":"Token usage statistics."}],"exampleRequest":"POST https://samapi.example.com/api/ai-chat\nContent-Type: application/json\n\n{\"message\":\"What is the capital of Indonesia?\",\"model\":\"gpt-4\"}"},{"slug":"ai-image","name":"AI Image Generator","description":"Generate images from text descriptions using advanced diffusion models.","category":"AI","method":"POST","endpoint":"/api/ai-image","icon":"ImagePlus","parameters":[{"name":"prompt","type":"string","required":true,"description":"Text description of the image to generate.","example":"A serene mountain lake at sunset"},{"name":"size","type":"string","required":false,"description":"Image dimensions (256x256, 512x512, 1024x1024).","example":"1024x1024"}],"responseExample":{"success":true,"data":{"url":"https://cdn.samapi.com/generated/image.png","size":"1024x1024","seed":42,"created":"2024-01-15T10:30:00Z"}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.url","type":"string","description":"URL of the generated image."},{"name":"data.size","type":"string","description":"Image dimensions."},{"name":"data.seed","type":"number","description":"Random seed used for generation."}],"exampleRequest":"POST https://samapi.example.com/api/ai-image\nContent-Type: application/json\n\n{\"prompt\":\"A serene mountain lake at sunset\",\"size\":\"1024x1024\"}"},{"slug":"qrcode","name":"QR Code Generator","description":"Generate QR codes from any text, URL, or data with customizable size and color.","category":"Utility","method":"GET","endpoint":"/api/qrcode","icon":"QrCode","parameters":[{"name":"text","type":"string","required":true,"description":"The text or URL to encode into the QR code.","example":"https://example.com"},{"name":"size","type":"number","required":false,"description":"QR code size in pixels (default 300).","example":"500"}],"responseExample":{"success":true,"data":{"url":"https://cdn.samapi.com/qr/XXXX.png","text":"https://example.com","size":500,"format":"png"}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.url","type":"string","description":"URL of the generated QR code image."},{"name":"data.text","type":"string","description":"Encoded text content."},{"name":"data.size","type":"number","description":"Image size in pixels."}],"exampleRequest":"https://samapi.example.com/api/qrcode?text=https://example.com&size=500"},{"slug":"weather","name":"Weather Info","description":"Get current weather conditions and forecasts for any city worldwide.","category":"Utility","method":"GET","endpoint":"/api/weather","icon":"CloudSun","parameters":[{"name":"city","type":"string","required":true,"description":"City name to get weather for.","example":"Jakarta"},{"name":"units","type":"string","required":false,"description":"Temperature units (metric, imperial).","example":"metric"}],"responseExample":{"success":true,"data":{"city":"Jakarta","country":"Indonesia","temperature":31,"condition":"Partly Cloudy","humidity":75,"windSpeed":12,"forecast":[{"day":"Mon","high":32,"low":25,"condition":"Sunny"},{"day":"Tue","high":30,"low":24,"condition":"Rain"}]}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.city","type":"string","description":"City name."},{"name":"data.temperature","type":"number","description":"Current temperature."},{"name":"data.condition","type":"string","description":"Weather condition description."},{"name":"data.forecast","type":"array","description":"Multi-day forecast array."}],"exampleRequest":"https://samapi.example.com/api/weather?city=Jakarta&units=metric"},{"slug":"ip-lookup","name":"IP Address Lookup","description":"Lookup geolocation, ISP, and network information for any IP address.","category":"Utility","method":"GET","endpoint":"/api/ip-lookup","icon":"Globe","parameters":[{"name":"ip","type":"string","required":false,"description":"IP address to lookup (defaults to caller IP if omitted).","example":"8.8.8.8"}],"responseExample":{"success":true,"data":{"ip":"8.8.8.8","city":"Mountain View","region":"California","country":"United States","countryCode":"US","latitude":37.3861,"longitude":-122.084,"timezone":"America/Los_Angeles","isp":"Google LLC","org":"Google LLC"}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.ip","type":"string","description":"Queried IP address."},{"name":"data.city","type":"string","description":"City name."},{"name":"data.country","type":"string","description":"Country name."},{"name":"data.isp","type":"string","description":"Internet Service Provider."}],"exampleRequest":"https://samapi.example.com/api/ip-lookup?ip=8.8.8.8"},{"slug":"text-to-speech","name":"Text to Speech","description":"Convert text into natural-sounding speech audio in multiple languages and voices.","category":"Utility","method":"POST","endpoint":"/api/tts","icon":"Volume2","parameters":[{"name":"text","type":"string","required":true,"description":"The text to convert to speech.","example":"Hello, welcome to SamApi."},{"name":"lang","type":"string","required":false,"description":"Language code (en, id, ja, etc.).","example":"en"}],"responseExample":{"success":true,"data":{"url":"https://cdn.samapi.com/tts/XXXX.mp3","text":"Hello, welcome to SamApi.","lang":"en","duration":"2.1s"}},"responseFields":[{"name":"success","type":"boolean","description":"Whether the request succeeded."},{"name":"data.url","type":"string","description":"URL of the generated audio file."},{"name":"data.lang","type":"string","description":"Language used for synthesis."},{"name":"data.duration","type":"string","description":"Audio duration."}],"exampleRequest":"POST https://samapi.example.com/api/tts\nContent-Type: application/json\n\n{\"text\":\"Hello, welcome to SamApi.\",\"lang\":\"en\"}"}];
const categories=[...new Set(apiDefinitions.map(a=>a.category))];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={Instagram:'instagram',Music2:'music-2',Youtube:'youtube',Facebook:'facebook',Music:'music',Twitter:'twitter',Bot:'bot',ImagePlus:'image-plus',QrCode:'qr-code',CloudSun:'cloud-sun',Globe:'globe',Volume2:'volume-2',BookOpen:'book-open',Menu:'menu',X:'x',Moon:'moon',Sun:'sun',ArrowRight:'arrow-right',ChevronRight:'chevron-right',ChevronDown:'chevron-down',Sparkles:'sparkles',Layers3:'layers-3',Search:'search',Gauge:'gauge',ShieldCheck:'shield-check',Database:'database',Zap:'zap',Check:'check',Copy:'copy',Play:'play',Home:'home',WifiOff:'wifi-off'};
const icon=(n,c='w-4 h-4')=>`<i data-lucide="${icons[n]||n}" class="${c}"></i>`;
const refresh=()=>window.lucide&&lucide.createIcons();
function navigate(p){location.hash=p;scrollTo({top:0,behavior:'smooth'})}
function path(){return location.hash.replace(/^#/,'')||'/'}
let theme=localStorage.getItem('samapi-theme')||'dark';
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('samapi-theme',theme);render()}
function api(slug){return apiDefinitions.find(a=>a.slug===slug)}
function nav(){return `<header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur-xl dark:border-slate-800/80 dark:bg-slate-950/90"><div class="mx-auto flex h-[72px] max-w-7xl items-center justify-between px-5 sm:px-8"><button onclick="navigate('/')" class="flex items-center gap-2.5"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-slate-950 text-white dark:bg-white dark:text-slate-950">${icon('Zap')}</span><span class="font-bold">SamApi</span></button><nav class="hidden gap-1 md:flex"><button onclick="navigate('/')" class="rounded-lg px-3 py-2 text-sm">Home</button><button onclick="navigate('/docs')" class="rounded-lg px-3 py-2 text-sm">Documentation</button></nav><div class="hidden items-center gap-3 md:flex"><span class="text-xs font-semibold text-emerald-600">● API Online</span><button onclick="toggleTheme()" class="flex h-9 w-9 items-center justify-center rounded-lg">${icon(theme==='dark'?'Sun':'Moon')}</button><button onclick="navigate('/docs')" class="rounded-lg bg-slate-950 px-4 py-2 text-sm font-semibold text-white dark:bg-white dark:text-slate-950">Get started</button></div><button onclick="$('#mobile').classList.toggle('hidden')" class="md:hidden">${icon('Menu','h-5 w-5')}</button></div><div id="mobile" class="hidden border-t px-5 pb-5 pt-3 md:hidden"><button onclick="navigate('/')" class="block w-full py-3 text-left text-sm">Home</button><button onclick="navigate('/docs')" class="block w-full py-3 text-left text-sm">Documentation</button><button onclick="toggleTheme()" class="mt-2 border-t pt-4 text-sm">Theme</button></div></header>`}
function footer(){return `<footer class="border-t border-slate-200 dark:border-slate-800"><div class="mx-auto max-w-7xl px-5 py-8 text-xs text-slate-400">© ${new Date().getFullYear()} SamApi. All rights reserved.</div></footer>`}
function card(a){return `<button onclick="navigate('/docs/${a.slug}')" class="group flex items-center gap-4 rounded-xl border border-slate-200 bg-white p-4 text-left hover:-translate-y-0.5 hover:shadow-lg dark:border-slate-800 dark:bg-slate-900/50"><span class="flex h-10 w-10 items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800">${icon(a.icon)}</span><span class="min-w-0 flex-1"><span class="block truncate text-sm font-bold">${esc(a.name)}</span><span class="mt-1 block truncate font-mono text-[10px] text-slate-400">${a.method} ${esc(a.endpoint)}</span></span>${icon('ChevronRight')}</button>`}
function home(){let q='';function draw(){let f=apiDefinitions.filter(a=>(a.name+' '+a.description+' '+a.category).toLowerCase().includes(q.toLowerCase()));$('#page').innerHTML=`<main><section class="relative overflow-hidden border-b border-slate-200 dark:border-slate-800"><div class="absolute inset-0 dot-grid opacity-70"></div><div class="relative mx-auto max-w-7xl px-5 py-20 sm:px-8 sm:py-28"><div class="mx-auto max-w-4xl text-center"><div class="mb-7 inline-flex items-center gap-2 rounded-full border border-cyan-200 bg-cyan-50 px-3.5 py-1.5 text-xs font-semibold text-cyan-700 dark:border-cyan-900 dark:bg-cyan-950/30 dark:text-cyan-400">${icon('Sparkles')} Build faster with SamApi</div><h1 class="text-5xl font-bold leading-[1.08] tracking-[-0.055em] sm:text-7xl">Powerful APIs.<br><span class="text-cyan-500">Simple to use.</span></h1><p class="mx-auto mt-7 max-w-2xl text-base leading-7 text-slate-500 sm:text-lg">A collection of fast, reliable APIs built for modern developers. Download media, generate content, and build something amazing.</p><div class="mt-9 flex flex-col justify-center gap-3 sm:flex-row"><button onclick="navigate('/docs')" class="rounded-xl bg-slate-950 px-6 py-3.5 text-sm font-semibold text-white dark:bg-white dark:text-slate-950">Explore the APIs</button><button onclick="navigate('/docs')" class="rounded-xl border px-6 py-3.5 text-sm font-semibold">Read documentation</button></div></div><div class="mx-auto mt-20 grid max-w-4xl grid-cols-2 divide-x border-y py-6 sm:grid-cols-4"><div class="px-4 text-center"><div class="text-2xl font-bold">${apiDefinitions.length}+</div><div class="text-xs text-slate-500">Available APIs</div></div><div class="px-4 text-center"><div class="text-2xl font-bold text-emerald-500">100%</div><div class="text-xs text-slate-500">API uptime</div></div><div class="px-4 text-center"><div class="text-2xl font-bold">&lt;120ms</div><div class="text-xs text-slate-500">Avg. response</div></div><div class="px-4 text-center"><div class="text-2xl font-bold">99.9%</div><div class="text-xs text-slate-500">Reliability</div></div></div></div></section><section class="mx-auto max-w-7xl px-5 py-20 sm:px-8"><div class="mb-10 flex flex-col justify-between gap-5 sm:flex-row sm:items-end"><div><div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-cyan-600">${icon('Layers3')} Explore our APIs</div><h2 class="text-3xl font-bold sm:text-4xl">Everything you need to build.</h2><p class="mt-3 max-w-lg text-sm text-slate-500">Production-ready endpoints with clear documentation and predictable responses.</p></div><div class="relative w-full sm:w-64">${icon('Search','absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400')}<input id="search" value="${esc(q)}" placeholder="Search APIs..." class="h-11 w-full rounded-xl border bg-white pl-10 pr-4 text-sm dark:border-slate-800 dark:bg-slate-900"></div></div><div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${f.map(card).join('')}</div></section><section class="border-y bg-slate-50/70 dark:border-slate-800 dark:bg-slate-900/30"><div class="mx-auto max-w-7xl px-5 py-20 sm:px-8"><div class="grid gap-10 lg:grid-cols-2"><div><div class="mb-3 text-xs font-bold uppercase tracking-widest text-cyan-600">Developer first</div><h2 class="text-3xl font-bold sm:text-4xl">The fastest way from idea to API.</h2><p class="mt-5 max-w-lg text-sm leading-7 text-slate-500">Built with developers in mind. Every endpoint is designed to be intuitive, documented, and ready to ship.</p></div><div class="rounded-2xl bg-slate-950 p-6"><div class="mb-6 font-mono text-xs text-slate-500">request.js</div><pre class="overflow-x-auto font-mono text-xs leading-6 text-slate-300">const response = await fetch('https://samapi.com/api/instagram?url=' + postUrl);

const { data } = await response.json();
console.log(data.media[0].url);</pre></div></div></div></section><section class="mx-auto max-w-7xl px-5 py-20 text-center"><p class="text-sm font-semibold text-cyan-600">Ready to build?</p><h2 class="mt-3 text-3xl font-bold sm:text-4xl">Your next project starts here.</h2><button onclick="navigate('/docs')" class="mt-7 rounded-xl bg-slate-950 px-6 py-3.5 text-sm font-semibold text-white dark:bg-white dark:text-slate-950">Start building</button></section></main>`;$('#search').oninput=e=>{q=e.target.value;draw();setTimeout(()=>$('#search')?.focus(),0)};refresh()}draw()}
function code(c,l='json'){return `<div class="overflow-hidden rounded-xl bg-slate-950"><div class="border-b border-slate-800 px-4 py-2 font-mono text-[10px] text-slate-500">${l}</div><pre class="overflow-x-auto p-4 text-xs leading-6 text-slate-300"><code>${esc(c)}</code></pre></div>`}
function detail(a){return `<div class="max-w-3xl"><div class="mb-8 flex items-start gap-4"><div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-100 dark:bg-slate-800">${icon(a.icon,'h-7 w-7')}</div><div><span class="rounded-md bg-cyan-50 px-2 py-1 text-[10px] font-bold text-cyan-700 dark:bg-cyan-950 dark:text-cyan-400">${esc(a.category)}</span><h1 class="mt-2 text-3xl font-bold sm:text-4xl">${esc(a.name)}</h1></div></div><p class="mb-8 text-[15px] leading-7 text-slate-500">${esc(a.description)}</p><div class="mb-10 rounded-xl border p-4 font-mono text-xs dark:border-slate-800">${a.method} https://samapi.example.com${esc(a.endpoint)}</div><section class="mb-10"><h2 class="mb-4 text-lg font-bold">Parameters</h2><div class="overflow-hidden rounded-xl border dark:border-slate-800">${a.parameters.map(p=>`<div class="grid gap-2 border-b px-4 py-4 last:border-0 sm:grid-cols-[1fr_100px_2fr] dark:border-slate-800"><div><code class="font-mono text-xs text-cyan-600">${esc(p.name)}</code> ${p.required?'<span class="text-[9px] font-bold text-red-500">required</span>':''}</div><code class="text-[11px] text-slate-400">${esc(p.type)}</code><p class="text-xs text-slate-500">${esc(p.description)}</p></div>`).join('')}</div></section><section class="mb-10"><h2 class="mb-4 text-lg font-bold">Example request</h2>${code(a.exampleRequest,a.method==='POST'?'http':'url')}</section><section><h2 class="mb-4 text-lg font-bold">Example response</h2>${code(JSON.stringify(a.responseExample,null,2))}<div class="mt-6 overflow-hidden rounded-xl border dark:border-slate-800"><div class="border-b px-4 py-3 text-[10px] font-bold uppercase text-slate-400">Response fields</div>${a.responseFields.map(f=>`<div class="flex flex-col gap-1 border-b px-4 py-3 last:border-0 sm:flex-row dark:border-slate-800"><code class="w-48 text-xs text-cyan-600">${esc(f.name)}</code><code class="w-20 text-[11px] text-slate-400">${esc(f.type)}</code><span class="text-xs text-slate-500">${esc(f.description)}</span></div>`).join('')}</div></section><div class="mt-8 rounded-2xl border border-cyan-200 bg-cyan-50/50 p-5 dark:border-cyan-900 dark:bg-cyan-950/20"><div class="mb-4 flex items-center gap-2">${icon('Play')}<h3 class="text-sm font-bold">Try this API</h3></div>${a.parameters.map(p=>`<label class="mb-3 block"><span class="mb-1 block text-xs font-semibold">${esc(p.name)} ${p.required?'<span class="text-red-500">*</span>':''}</span><input class="try h-10 w-full rounded-lg border px-3 text-xs dark:border-slate-700 dark:bg-slate-900" data-param="${esc(p.name)}" placeholder="${esc(p.example||'')}"></label>`).join('')}<button id="try" class="mt-2 w-full rounded-lg bg-cyan-600 py-2.5 text-xs font-bold text-white">Send request</button><div id="result" class="mt-3"></div></div></div>`}
function docs(){let q='',open=Object.fromEntries(categories.map(c=>[c,true]));function draw(){let p=path(),slug=p.startsWith('/docs/')?decodeURIComponent(p.split('/')[2]||''):'';let selected=api(slug),f=apiDefinitions.filter(a=>(a.name+' '+a.endpoint).toLowerCase().includes(q.toLowerCase()));$('#page').innerHTML=`<div class="flex min-h-[calc(100vh-72px)]"><aside class="hidden w-72 shrink-0 border-r dark:border-slate-800 lg:block"><div class="sticky top-[72px] h-[calc(100vh-72px)] overflow-auto"><div class="border-b p-5 dark:border-slate-800"><div class="mb-4 flex items-center gap-2 text-sm font-bold">${icon('BookOpen')} API Reference</div><input id="docq" value="${esc(q)}" placeholder="Search endpoints" class="h-9 w-full rounded-lg border bg-slate-50 px-3 text-xs dark:border-slate-700 dark:bg-slate-900"></div><nav class="px-3 py-4">${categories.map(c=>{let items=f.filter(a=>a.category===c);return items.length?`<div class="mb-4"><button data-cat="${c}" class="cat mb-1 flex w-full justify-between px-2 text-[10px] font-bold uppercase tracking-widest text-slate-400">${c}${icon('ChevronDown')}</button><div class="${open[c]?'':'hidden'}">${items.map(a=>`<button data-slug="${a.slug}" class="link flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-xs ${selected?.slug===a.slug?'bg-cyan-50 text-cyan-700 dark:bg-cyan-950 dark:text-cyan-400':''}">${icon(a.icon)}<span class="flex-1 truncate">${esc(a.name)}</span><b class="text-[9px] ${a.method==='GET'?'text-emerald-500':'text-amber-500'}">${a.method}</b></button>`).join('')}</div></div>`:''}).join('')}</nav></div></aside><main class="min-w-0 flex-1 px-5 py-12 sm:px-8 lg:px-14 lg:py-16">${selected?detail(selected):`<div class="max-w-3xl"><div class="mb-10">${icon('BookOpen')}<h1 class="mt-3 text-4xl font-bold sm:text-5xl">API Reference</h1><p class="mt-4 text-slate-500">Everything you need to integrate SamApi into your project. Pick an endpoint from the menu to get started.</p></div><div class="grid gap-4 sm:grid-cols-2">${f.map(card).join('')}</div></div>`}</main></div>`;$('#docq').oninput=e=>{q=e.target.value;draw();setTimeout(()=>$('#docq')?.focus(),0)};document.querySelectorAll('.link').forEach(b=>b.onclick=()=>navigate('/docs/'+b.dataset.slug));document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{open[b.dataset.cat]=!open[b.dataset.cat];draw()});if(selected)$('#try').onclick=()=>$('#result').innerHTML=code(JSON.stringify(selected.responseExample,null,2));refresh()}draw()}
function render(){let p=path();document.documentElement.classList.toggle('dark',theme==='dark');document.title=p.startsWith('/docs')?'Documentation — SamApi':'SamApi — Simple, powerful APIs';$('#app').innerHTML=nav()+`<div id="page"></div>`+footer();p==='/'?home():p==='/docs'||p.startsWith('/docs/')?docs():$('#page').innerHTML=`<main class="flex min-h-screen items-center justify-center"><div class="text-center"><p class="font-mono text-xs text-cyan-600">ERROR 404</p><h1 class="mt-3 text-5xl font-bold">Endpoint not found</h1><button onclick="navigate('/')" class="mt-7 rounded-xl bg-slate-950 px-5 py-3 text-white">Homepage</button></div></main>`;refresh()}
window.addEventListener('hashchange',render);render();
</script>
