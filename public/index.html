<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MyStorage - Private File Storage">
  <title>MyStorage - Private File Storage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <h1>MY STORAGE</h1>
        <p>Private File Storage</p>
      </div>

      <div id="errorMsg" class="error-msg"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="accessKey">Access Key</label>
          <input
            type="password"
            id="accessKey"
            name="accessKey"
            placeholder="Enter your access key"
            required
            autofocus
            autocomplete="current-password"
          >
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span id="loginBtnText">LOGIN</span>
          <span id="loginSpinner" class="spinner hidden"></span>
        </button>
      </form>

      <div class="login-footer">
        Your files. Private and secure.
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
