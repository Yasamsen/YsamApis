<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <title>Alya OCR Copilot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">A</div>
        <div>
          <h1>Alya OCR Copilot</h1>
          <p>Screenshot → OCR → Gemini</p>
        </div>
      </div>
      <span id="status" class="status">Siap</span>
    </header>

    <section class="grid">
      <div class="card">
        <div class="card-title">
          <span>📷 Screenshot</span>
          <label class="upload">
            Pilih gambar
            <input id="imageInput" type="file" accept="image/*">
          </label>
        </div>

        <div id="dropzone" class="dropzone">
          <div class="drop-icon">↑</div>
          <b>Upload screenshot</b>
          <span>PNG, JPG, WEBP — OCR diproses di browser</span>
        </div>

        <img id="preview" class="preview hidden" alt="Preview">

        <div class="ocr-tools">
          <label>Bahasa OCR
            <select id="lang">
              <option value="eng">English / kode</option>
              <option value="ind">Indonesia</option>
            </select>
          </label>
          <button id="ocrBtn" disabled>🔎 Baca teks</button>
        </div>

        <label class="label">Hasil OCR</label>
        <textarea id="ocrText" placeholder="Teks hasil OCR akan muncul di sini..."></textarea>
      </div>

      <div class="card chat-card">
        <div class="card-title">
          <span>🤖 Gemini</span>
          <button id="clearBtn" class="ghost">Bersihkan</button>
        </div>

        <div id="chat" class="chat">
          <div class="empty">
            Upload screenshot, jalankan OCR, lalu tanyakan apa yang ingin kamu ketahui.
          </div>
        </div>

        <div class="composer">
          <textarea id="message" rows="2" placeholder="Contoh: jelaskan error ini dan cara memperbaikinya..."></textarea>
          <button id="sendBtn">Kirim ➜</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
