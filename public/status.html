<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status — SamApi</title>
  <meta name="description" content="SamApi system status" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%236366f1' width='32' height='32' rx='8'/><text x='50%' y='55%' fill='white' font-size='16' font-family='system-ui' text-anchor='middle' dominant-baseline='middle' font-weight='700'>S</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="status">
  <div class="bg-grid" aria-hidden="true"></div>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">Sam<span>Api</span></a>
      <ul class="nav-links">
        <li><a href="/#apis">APIs</a></li>
        <li><a href="/docs">Documentation</a></li>
        <li><a href="/status" class="active">Status</a></li>
      </ul>
      <div class="nav-actions" style="margin-left:auto">
        <button type="button" class="theme-toggle" aria-label="Toggle theme">☀</button>
        <div data-user-slot></div>
        <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <div class="mobile-nav">
    <a href="/#apis">APIs</a>
    <a href="/docs">Documentation</a>
    <a href="/status">Status</a>
  </div>

  <main class="section" style="text-align:center;">
    <h1 style="font-size:1.75rem;margin-bottom:0.5rem;">SamApi Status</h1>
    <p style="color:var(--success);margin-bottom:2.5rem;display:flex;align-items:center;justify-content:center;gap:0.5rem;">
      <span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;"></span>
      All Systems Operational
    </p>
    <div class="status-list">
      <div class="status-item"><span class="name">API Gateway</span><span class="badge-op">Operational</span></div>
      <div class="status-item"><span class="name">Downloader APIs</span><span class="badge-op">Operational</span></div>
      <div class="status-item"><span class="name">Search APIs</span><span class="badge-op">Operational</span></div>
      <div class="status-item"><span class="name">Documentation</span><span class="badge-op">Operational</span></div>
      <div class="status-item"><span class="name">Authentication</span><span class="badge-op">Operational</span></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom" style="border:none;">
      <span>© 2026 SamApi</span>
      <span>Built for developers.</span>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
