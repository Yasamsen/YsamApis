<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Status — SamApi</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-grid" data-theme="dark">

<nav class="navbar">
  <div class="navbar-inner">
    <a class="brand" href="/"><span class="brand-mark">S</span>SamApi</a>
    <div class="nav-links">
      <a href="/#explorer">APIs</a>
      <a href="/docs">Documentation</a>
      <a href="/status" class="active">Status</a>
    </div>
    <div class="navbar-right">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
      <div data-nav-auth></div>
    </div>
  </div>
</nav>

<main class="status-shell">
  <h1 style="font-size:24px;margin-bottom:20px;letter-spacing:-0.02em;">SamApi Status</h1>
  <div class="status-banner"><span class="dot"></span> All Systems Operational</div>
  <div class="status-list">
    <div class="status-row"><span>API Gateway</span><span class="status-ok">Operational</span></div>
    <div class="status-row"><span>Downloader APIs</span><span class="status-ok">Operational</span></div>
    <div class="status-row"><span>Search APIs</span><span class="status-ok">Operational</span></div>
    <div class="status-row"><span>Documentation</span><span class="status-ok">Operational</span></div>
    <div class="status-row"><span>Authentication</span><span class="status-ok">Operational</span></div>
  </div>
  <p class="status-note">Status reflects service configuration, not live real-time monitoring.</p>
</main>

<script src="/script.js"></script>
</body>
</html>
