<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Endpoint not found | SamApi</title>
  <meta name="description" content="The page or API endpoint you requested does not exist." />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="robots" content="noindex" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82f6'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-family='system-ui' font-weight='700'>S</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <nav class="navbar" role="navigation" aria-label="Main">
    <div class="navbar-inner">
      <a href="/" class="logo">
        <span class="logo-icon">S</span>
        SamApi
      </a>
      <div class="nav-right">
        <button type="button" class="theme-toggle" aria-label="Toggle theme">☾</button>
      </div>
    </div>
  </nav>

  <main class="error-page">
    <div class="error-code">404</div>
    <h2>Endpoint not found</h2>
    <p>The API endpoint you're looking for doesn't exist.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/docs" class="btn btn-secondary">Documentation</a>
    </div>
  </main>

  <script>
    (function () {
      const saved = localStorage.getItem('samapi-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      document.querySelector('.theme-toggle').textContent = saved === 'dark' ? '☾' : '☀';
      document.querySelector('.theme-toggle').addEventListener('click', function () {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('samapi-theme', next);
        this.textContent = next === 'dark' ? '☾' : '☀';
      });
    })();
  </script>
</body>
</html>
