<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>Documentation — Yasam API</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header class="nav">

  <a class="brand" href="/">
    <span>Y</span>
    Yasam <b>API</b>
  </a>

  <nav id="mainNav">
    <a href="/">Home</a>
    <a class="active" href="/docs">Documentation</a>
  </nav>

  <button id="theme" class="theme-btn" type="button" aria-label="Toggle theme">
    ☾
  </button>

  <button id="menuBtn" class="menu-btn" type="button" aria-label="Open menu">
    ☰
  </button>

</header>


<div class="docs">

  <aside id="docsAside">

    <small>API REFERENCE</small>

    <input
      id="search"
      type="search"
      placeholder="Search endpoint..."
      autocomplete="off"
      aria-label="Search endpoint"
    >

    <div id="side">
      Loading...
    </div>

  </aside>


  <main>

    <div class="doc-title">

      <div>
        <small>DOCUMENTATION</small>

        <h1>API Reference</h1>

        <p>
          Endpoint dan dokumentasi dibaca otomatis dari folder
          <code>api/</code>.
        </p>
      </div>

      <span class="pill">● ONLINE</span>

    </div>


    <div id="docs">
      Loading documentation...
    </div>

  </main>

</div>


<footer>

  <div class="wrap foot">

    <b>Yasam API</b>

    <span>Documentation</span>

    <small>
      © <span id="year"></span>
    </small>

  </div>

</footer>


<script src="/script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const menuBtn = document.getElementById("menuBtn");
  const mainNav = document.getElementById("mainNav");

  if (!menuBtn || !mainNav) return;

  menuBtn.addEventListener("click", () => {

    const opened = mainNav.classList.toggle("open");

    menuBtn.textContent = opened ? "✕" : "☰";

    menuBtn.setAttribute(
      "aria-label",
      opened ? "Close menu" : "Open menu"
    );

  });


  mainNav.querySelectorAll("a").forEach(link => {

    link.addEventListener("click", () => {

      mainNav.classList.remove("open");

      menuBtn.textContent = "☰";

      menuBtn.setAttribute(
        "aria-label",
        "Open menu"
      );

    });

  });

});
</script>

</body>
</html>
